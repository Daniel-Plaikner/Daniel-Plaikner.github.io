<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daniel Plaikner · CV</title>
  <meta name="robots" content="noindex">
  <style>
    @font-face { font-family: Inter; src: url(fonts/inter.woff2) format("woff2"); font-weight: 400 700; }
    /* One A4 page. build-cv.ps1 prints this page to cv/Daniel-Plaikner-CV-<lang>.pdf */
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html { background: #d9d6e3; }
    body { margin: 0; font: 8.6pt/1.45 Inter, "Segoe UI", system-ui, sans-serif; color: #1c1a26; }
    .page { width: 210mm; height: 297mm; margin: 0 auto; display: grid; grid-template-columns: 67mm 1fr; background: #fff; overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    h2 { margin: 0 0 2.2mm; font-size: 8pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    p { margin: 0; }

    /* sidebar */
    aside { background: #15131f; color: #e8e6f0; padding: 9mm 7mm 8mm 8mm; display: flex; flex-direction: column; gap: 5mm; font-size: 8pt; }
    .photo { width: 31mm; height: 31mm; border-radius: 50%; padding: 1mm; align-self: center; background: conic-gradient(from 210deg, #b794f6, #7cc4ff, #7ee7c1, #b794f6); }
    .photo img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: .8mm solid #15131f; }
    aside h2 { color: #b794f6; }
    .contact div { margin-bottom: 1mm; overflow-wrap: anywhere; }
    .lang-row { display: flex; justify-content: space-between; align-items: center; gap: 2mm; margin-bottom: 1.4mm; }
    .lang-row small { display: block; font-size: 7pt; color: #9390a8; }
    .dots { display: flex; gap: 1mm; flex: none; }
    .dots i { width: 2.1mm; height: 2.1mm; border-radius: 50%; background: #34314a; }
    .dots i.on { background: #b794f6; }
    .group { margin-bottom: 2mm; }
    .group b { display: block; font-size: 7.4pt; font-weight: 600; color: #7ee7c1; margin-bottom: .6mm; }
    .cert { margin-bottom: 1.8mm; }
    .cert b { display: block; font-weight: 600; line-height: 1.3; }
    .cert small { font-size: 7pt; color: #9390a8; }

    /* main column */
    main { padding: 9mm 10mm 9mm 9mm; display: flex; flex-direction: column; gap: 4mm; }
    header { border-bottom: .5mm solid #6b3fd1; padding-bottom: 4mm; }
    h1 { margin: 0; font-size: 25pt; line-height: 1.1; letter-spacing: -.02em; }
    .role { font-size: 11pt; color: #6b3fd1; font-weight: 600; margin-top: 1mm; }
    main h2 { color: #6b3fd1; }
    .entry { display: grid; grid-template-columns: 1fr auto; column-gap: 4mm; margin-bottom: 2.8mm; }
    .entry:last-child { margin-bottom: 0; }
    .entry .title { font-weight: 700; font-size: 9.2pt; }
    .entry .when { font-size: 7.6pt; color: #605c75; white-space: nowrap; padding-top: .4mm; }
    .entry .org { color: #6b3fd1; font-weight: 500; }
    .entry .more { grid-column: 1 / -1; color: #3d3a4d; margin-top: .6mm; }
    .entry .thesis { grid-column: 1 / -1; margin-top: .6mm; }
    .events { display: grid; grid-template-columns: 1fr 1fr; gap: .8mm 6mm; }
    .events span { color: #605c75; font-size: 7.6pt; margin-right: 1.5mm; }
    /* set by the script below when a column has more content than fits on the page */
    .overflow { outline: 2mm solid #e5484d; outline-offset: -2mm; }
    @media screen { .page { margin: 8mm auto; box-shadow: 0 4mm 12mm rgba(0, 0, 0, .25); } }
  </style>
</head>
<body>
  <div class="page">
    <aside id="side"></aside>
    <main id="main"></main>
  </div>
  <script src="content.js"></script>
  <script>
    (() => {
      const S = window.SITE, U = S.ui;
      document.documentElement.lang = LANG;
      const strip = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
      const row = (value, href) => (value ? `<div>${href ? `<a href="${href}">${value}</a>` : value}</div>` : "");

      document.getElementById("side").innerHTML = `
        <div class="photo"><img src="photo-cv.jpg" alt=""></div>
        <section class="contact"><h2>${t(U.contact)}</h2>
          ${row(t(S.location))}
          ${row(S.links.email, `mailto:${S.links.email}`)}
          ${row(S.links.phone, `tel:${S.links.phone.replace(/\s/g, "")}`)}
          ${row(S.links.linkedin && strip(S.links.linkedin), S.links.linkedin)}
          ${row(strip(S.links.github), S.links.github)}
          ${row(S.site, `https://${S.site}`)}
        </section>
        <section><h2>${t(U.languages)}</h2>${S.languages.map(l => `
          <div class="lang-row"><div>${t(l.name)}<small>${t(l.level)}</small></div>
          <div class="dots">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= l.dots ? "on" : ""}"></i>`).join("")}</div></div>`).join("")}</section>
        <section><h2>${t(U.skills)}</h2>${S.skills.map(g => `<div class="group"><b>${t(g.group)}</b>${g.items.join(" · ")}</div>`).join("")}</section>
        <section><h2>${t(U.certifications)}</h2>${S.certifications.map(c => `
          <div class="cert"><b>${t(c.title)}</b><small>${[t(c.org), t(c.when)].filter(Boolean).join(" · ")}</small></div>`).join("")}</section>`;

      const entry = e => `
        <div class="entry">
          <div><div class="title">${t(e.title)}</div><div class="org">${[t(e.org), t(e.place), e.grade && `${t(U.grade)} ${e.grade}`].filter(Boolean).join(" · ")}</div></div>
          <div class="when">${t(e.when)}</div>
          ${e.thesis ? `<p class="thesis">${t(U.thesis)}: <em>${e.thesis}</em></p>` : ""}
          ${e.text ? `<p class="more">${t(e.text)}</p>` : ""}
        </div>`;

      document.getElementById("main").innerHTML = `
        <header><h1>${S.name}</h1><div class="role">${t(S.role)}</div></header>
        <section><h2>${t(U.profile)}</h2><p>${t(S.profile)}</p></section>
        <section><h2>${t(U.experience)}</h2>${S.experience.map(entry).join("")}</section>
        <section><h2>${t(U.education)}</h2>${S.education.map(entry).join("")}</section>
        <section><h2>${t(U.events)}</h2><div class="events">${S.events.map(e => `<div><span>${e.year}</span>${t(e.text)}</div>`).join("")}</div></section>`;

      // One-page check: outline a column in red when its content does not fit. data-free = spare millimetres.
      const check = () => document.querySelectorAll("aside, main").forEach(el => {
        const free = el.getBoundingClientRect().bottom - parseFloat(getComputedStyle(el).paddingBottom) - el.lastElementChild.getBoundingClientRect().bottom;
        el.dataset.free = Math.round(free / 3.78);
        el.classList.toggle("overflow", free < 0);
      });
      check();
      document.fonts.ready.then(check);
    })();
  </script>
</body>
</html>
